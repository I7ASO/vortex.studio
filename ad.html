<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX STUDIO | مرحباً بك</title>
    
    <!-- أيقونة الموقع -->
    <link rel="shortcut icon" href="https://i.postimg.cc/g2J7gWgr/2306FBBB-8CC1-406C-822B-3FB96AE6E9AF.png" type="image/x-icon">
    
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --p: #a855f7; --bg: #0d0118; --c: rgba(255, 255, 255, 0.05); }
        body { 
            background: radial-gradient(circle at top,#29114d 0%,#150324 35%,#0d0118 100%); 
            color: #fff; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            text-align: center; 
        }

        .logo-img { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            border: 3px solid var(--p); 
            box-shadow: 0 0 25px var(--p); 
            object-fit: cover; 
            margin-bottom: 20px;
            animation: pulseLogo 2s infinite;
        }

        @keyframes pulseLogo {
            0% { box-shadow: 0 0 15px var(--p); }
            50% { box-shadow: 0 0 30px var(--p); transform: scale(1.03); }
            100% { box-shadow: 0 0 15px var(--p); }
        }

        h1 {
            color: #c084fc;
            text-shadow: 0 0 15px var(--p);
            font-size: 1.9rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .card { 
            background: var(--c); 
            border-radius: 25px; 
            padding: 30px 20px; 
            border: 1px solid rgba(168, 85, 247, 0.3); 
            backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.15);
            margin-bottom: 25px;
        }

        .welcome-text {
            font-size: 1.05rem;
            line-height: 2;
            color: #ddd;
            margin: 0;
        }

        .welcome-text strong {
            color: #c084fc;
        }

        .btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px; 
            margin-top: 15px; 
            border-radius: 16px; 
            text-decoration: none; 
            font-weight: bold; 
            color: #fff; 
            transition: 0.3s; 
            font-size: 1.05rem;
            width: 100%; 
            box-sizing: border-box; 
        }

        .btn-discord { 
            background: #5865F2; 
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); 
        }
        .btn-discord:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.7); 
        }

        .btn-site { 
            background: linear-gradient(135deg, #9333ea, #a855f7); 
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); 
        }
        .btn-site:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.7); 
        }

        .footer { 
            margin-top: 30px; 
            color: #777; 
            font-size: 0.85rem; 
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- شعار الاستوديو -->
        <img src="https://i.postimg.cc/g2J7gWgr/2306FBBB-8CC1-406C-822B-3FB96AE6E9AF.png" class="logo-img" alt="VORTEX LOGO">
        
        <h1>VORTEX STUDIO</h1>

        <!-- كارد الوصف -->
        <div class="card">
            <p class="welcome-text">
                نحن في <strong>VORTEX STUDIO</strong> نقدم حلولاً احترافية متكاملة في البرمجة، وتطوير سكربتات روبلوكس، وبرمجة بوتات الديسكورد. هدفنا توفير أعلى جودة وأمان لمشاريعك بأفضل سرعة وأداء.
            </p>
        </div>

        <!-- الأزرار المطلوبة -->
        <a href="https://discord.gg/ghJ3NcvsJs" target="_blank" class="btn btn-discord">
            <i class="fab fa-discord"></i> تعرف علينا من ديسكورد
        </a>

        <a href="https://i7aso.github.io/vortex.studio/" target="_blank" class="btn btn-site">
            <i class="fas fa-globe"></i> تعرف علينا من موقعنا الأساسي
        </a>

        <div class="footer">
            © 2026 VORTEX STUDIO — جميع الحقوق محفوظة.
        </div>
    </div>

</body>
</html>
